#
# /etc/kexts.conf: the kernel extensions that /etc/rc loads at boot, in
# this order, before the console shell starts (with kextload).
#
# One kext a line: its bundle, as a path or as a name in /Library/Extensions
# or /System/Library/Extensions, then, if it is not for every kernel, the
# SoCs it is for: bcm2711 (the Pi 4's kernel, 4K pages) or bcm2712 (the
# Pi 5's, 16K pages). A kext built for each kernel apart may come as
# NAME-bcm2711.kext and NAME-bcm2712.kext next to each other: NAME.kext here
# loads the one for the running kernel. For example:
#
#   /Library/Extensions/example.kext
#   example-display.kext bcm2712
